<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120d09">
  <title>Королевства — MADE BY PESSIMIST</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <!-- Игровой интерфейс -->
  <div id="hud" class="hidden">
    <div id="top">
      <div id="kinfo"></div>
      <div id="res"></div>
      <div id="tinfo"></div>
      <button class="ib" data-act="mute" id="muteBtn">🔊</button>
      <button class="ib" data-act="menu">☰</button>
    </div>
    <div id="left">
      <button class="tb" data-act="tech"><span>🔬</span><i>Наука</i><b class="dot hidden" id="dTech"></b></button>
      <button class="tb" data-act="diplo"><span>🤝</span><i>Дипл.</i><b class="dot hidden" id="dDiplo"></b></button>
      <button class="tb" data-act="hero"><span>🦸</span><i>Генерал</i></button>
      <button class="tb" data-act="log"><span>📜</span><i>Журнал</i></button>
      <button class="tb" data-act="ach"><span>🏆</span><i>Успехи</i></button>
    </div>
    <div id="panel" class="closed"></div>
    <div id="moveBar" class="hidden"></div>
    <div id="zoom">
      <button class="ib" data-act="zin">＋</button>
      <button class="ib" data-act="zout">－</button>
      <button class="ib" data-act="zfit">⛶</button>
    </div>
    <button id="endTurn" data-act="endturn">Конец хода ⏭</button>
    <div id="promo" class="hidden"></div>
  </div>

  <!-- Интро -->
  <div id="intro" class="screen">
    <div class="intro-in">
      <div class="made">MADE BY</div>
      <div class="pess" data-text="PESSIMIST">PESSIMIST</div>
      <div class="iline"></div>
      <div class="itap hidden" id="itap">коснись экрана — включить звук</div>
    </div>
  </div>

  <!-- Главное меню -->
  <div id="title" class="screen hidden">
    <div class="t-left">
      <img class="t-logo" src="icon.png" alt="">
      <div>
        <div class="t-sub">СТРАТЕГИЯ НА КАРТЕ МИРА</div>
        <h1>КОРОЛЕВСТВА</h1>
        <div class="t-by">MADE BY <b>PESSIMIST</b></div>
      </div>
    </div>
    <div class="t-right" id="titleMenu"></div>
  </div>

  <!-- Выбор королевства -->
  <div id="setup" class="screen hidden"></div>

  <!-- Загрузка -->
  <div id="loading" class="screen hidden">
    <div class="ld-in"><div class="ld-spin">⚔️</div><div id="ldTip"></div></div>
  </div>

  <div id="modal" class="hidden"><div id="sheet"></div></div>
  <div id="toasts"></div>

  <script src="data.js"></script>
  <script src="mapgen.js"></script>
  <script src="game.js"></script>
  <script src="audio.js"></script>
  <script src="render.js"></script>
  <script src="ui.js"></script>
</body>
</html>
