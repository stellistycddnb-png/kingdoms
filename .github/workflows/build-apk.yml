name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Landscape, fullscreen, icon and splash
        run: |
          set -e
          A=android/app/src/main
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' $A/AndroidManifest.xml
          grep -n "sensorLandscape" $A/AndroidManifest.xml
          cp -r resources/android/res/. $A/res/
          find $A/res -name 'splash*.png' -exec cp resources/splash.png {} \;
          mkdir -p $A/java/com/pessimist/kingdoms
          cp resources/MainActivity.java $A/java/com/pessimist/kingdoms/MainActivity.java

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingdoms-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
